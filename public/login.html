<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 - lioil 导航</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8ecf6 0%, #f5e6f0 50%, #e6f0f5 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            margin: 0 0 24px;
            color: #1a1a2e;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555770;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .error-msg {
            color: #fe1816;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            font-size: 14px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2>lioil 后台登录</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="password">管理员密码</label>
                <input type="password" id="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn-login" id="submitBtn">登 录</button>
            <div class="error-msg" id="errorMsg">密码错误，请重试</div>
        </form>
        <a href="/" class="back-link">返回首页</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const error = document.getElementById('errorMsg');
            btn.textContent = '登录中...';
            btn.disabled = true;
            error.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                });

                if (res.ok) {
                    window.location.href = '/admin.html';
                } else {
                    error.style.display = 'block';
                    btn.textContent = '登 录';
                    btn.disabled = false;
                }
            } catch (err) {
                error.textContent = '网络错误';
                error.style.display = 'block';
                btn.textContent = '登 录';
                btn.disabled = false;
            }
        });
    </script>
</body>


</html>
