<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTab 导航 - 精选网站导航</title>
    <meta name="description" content="iTab 导航 - 精心整理的网站导航">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" href="/favicon.ico">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 主样式 -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- 动态背景层 -->
    <div id="dynamicBg" class="dynamic-bg"></div>

    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-inner">
            <a class="logo" href="/" title="iTab 导航">
                <span class="logo-text">iTab 导航</span>
            </a>
            <div class="search-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索网站名称或网址..." autocomplete="off"
                    spellcheck="false">
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
                <a class="admin-link" href="/login.html" title="后台管理">⚙️</a>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-container">
        <!-- 分类标签 -->
        <nav class="category-tabs" id="categoryTabs" aria-label="导航分类">
            <!-- 动态数据填充 -->
        </nav>

        <!-- 导航卡片区域 -->
        <div id="navSectionsContainer">
            <!-- 动态数据填充 -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>正在加载导航数据...</p>
            </div>
        </div>

        <!-- 搜索结果区域 -->
        <div class="nav-grid" id="searchResults" style="display:none;"></div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>© <span id="currentYear"></span> <a href="/" target="_blank" rel="noopener noreferrer">iTab</a> · 精选网站导航</p>
    </footer>

    <!-- 应用脚本 -->
    <script src="/js/app.js"></script>
</body>

</html>
